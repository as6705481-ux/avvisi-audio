{# templates/auth/auth_reset_password.html #}
{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
  <form class="ios-form" id="resetForm" onsubmit="return false;">
    <h1 class="ios-title">Restablecer contraseña</h1>

    <div class="ios-group">
      <!-- Nueva contraseña -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-shield-lock"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nueva contraseña <span class="text-danger">*</span></div>
          <input id="pw" type="password" class="ios-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
          <div class="ios-hint">Usa una combinación segura (mín. 8 caracteres).</div>
        </div>
      </div>

      <!-- Confirmar -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-shield-check"></i></div>
        <div class="ios-body">
          <div class="ios-label">Confirmar contraseña <span class="text-danger">*</span></div>
          <input id="pw2" type="password" class="ios-input" placeholder="Repite la contraseña" autocomplete="new-password" required>
        </div>
      </div>

      <!-- Mensaje -->
      <div class="ios-row" style="border-bottom:0;">
        <div class="ios-ico"><i class="bi bi-info-circle"></i></div>
        <div class="ios-body">
          <div class="ios-label">Estado</div>
          <div id="msg" class="text-muted" style="white-space:pre-wrap;">Validando enlace…</div>
        </div>
      </div>
    </div>

    <div class="ios-actions">
      <a href="{{ url_for('auth.login_get') }}" class="btn btn-secondary ios-btn">Volver</a>
      <button id="btn" class="btn btn-success ios-btn" disabled>Actualizar</button>
    </div>
  </form>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const SUPABASE_URL = {{ SUPABASE_URL|tojson }};
  const SUPABASE_ANON_KEY = {{ SUPABASE_ANON_KEY|tojson }};

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const msgEl = document.getElementById("msg");
  const btnEl = document.getElementById("btn");
  const pwEl  = document.getElementById("pw");
  const pw2El = document.getElementById("pw2");

  function setMsg(t, kind="muted"){
    msgEl.classList.remove("text-muted","text-success","text-danger","text-warning");
    msgEl.classList.add(
      kind === "success" ? "text-success" :
      kind === "danger"  ? "text-danger"  :
      kind === "warning" ? "text-warning" :
      "text-muted"
    );
    msgEl.textContent = t;
  }

  // Leer tokens desde el hash (#...)
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const access_token  = hash.get("access_token");
  const refresh_token = hash.get("refresh_token");
  const type = hash.get("type");

  async function init(){
    btnEl.disabled = true;

    if (!access_token || !refresh_token) {
      setMsg("No se encontró token en la URL. Vuelve a pedir el correo de recuperación.", "danger");
      return;
    }
    if (type !== "recovery") {
      setMsg("Este enlace no es de recuperación (type != recovery).", "warning");
      return;
    }

    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
    if (error) {
      setMsg("Error creando sesión: " + error.message, "danger");
      return;
    }

    setMsg("Sesión válida. Escribe tu nueva contraseña.", "success");
    btnEl.disabled = false;
  }

  function validate(){
    const p1 = (pwEl.value || "");
    const p2 = (pw2El.value || "");
    if (!p1 || p1.length < 8) return { ok:false, msg:"La contraseña debe tener al menos 8 caracteres." };
    if (p1 !== p2) return { ok:false, msg:"Las contraseñas no coinciden." };
    return { ok:true };
  }

  pwEl.addEventListener("input", () => {
    const v = validate();
    if (!btnEl.disabled && !v.ok) setMsg(v.msg, "warning");
    if (!btnEl.disabled && v.ok) setMsg("Listo para actualizar.", "muted");
  });
  pw2El.addEventListener("input", () => {
    const v = validate();
    if (!btnEl.disabled && !v.ok) setMsg(v.msg, "warning");
    if (!btnEl.disabled && v.ok) setMsg("Listo para actualizar.", "muted");
  });

  btnEl.addEventListener("click", async () => {
    const v = validate();
    if (!v.ok) { setMsg(v.msg, "warning"); return; }

    btnEl.disabled = true;
    setMsg("Actualizando contraseña…", "muted");

    const { error } = await supabase.auth.updateUser({ password: pwEl.value });
    if (error) {
      setMsg("Error: " + error.message, "danger");
      btnEl.disabled = false;
      return;
    }

    setMsg("Contraseña actualizada ✅", "success");
    history.replaceState(null, "", window.location.pathname); // limpia el hash
    pwEl.value = "";
    pw2El.value = "";
  });

  init();
</script>

{% endblock %}
