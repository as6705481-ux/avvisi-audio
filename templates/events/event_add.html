{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
  <form method="POST" class="ios-form" id="eventForm">
    <h1 class="ios-title">Nuevo Evento</h1>

    <div class="ios-group">
      <!-- Nombre del evento -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-calendar2-event"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nombre del evento <span class="text-danger">*</span></div>
          <input type="text" name="name" class="ios-input" required placeholder="Ej. Boda López-Martínez">
        </div>
      </div>

      <!-- Cliente -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-building"></i></div>
        <div class="ios-body">
          <div class="ios-label">Cliente <span class="text-danger">*</span></div>
          <!-- NO TomSelect aquí (porque filtra contactos) -->
          <select name="client_id" id="clientSel" class="ios-select" required>
            {% for c in clients %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="ios-caret"><i class="bi bi-chevron-down"></i></div>
      </div>

      <!-- Contacto -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-person-lines-fill"></i></div>
        <div class="ios-body">
          <div class="ios-label">Contacto <span class="text-danger">*</span></div>
          <!-- NO TomSelect aquí (porque se filtra por cliente) -->
          <select name="contact_id" id="contactSel" class="ios-select" required>
            {% for k in contacts %}
              <option value="{{ k.id }}" data-client="{{ k.client_id }}">{{ k.name }}</option>
            {% endfor %}
          </select>
          <div style="font-size:12px;color:var(--ios-muted);margin-top:2px;">Se filtra por cliente.</div>
        </div>
        <div class="ios-caret"><i class="bi bi-chevron-down"></i></div>
      </div>

      <!-- Venue -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-geo-alt"></i></div>
        <div class="ios-body">
          <div class="ios-label">Lugar <span class="text-danger">*</span></div>
          <input type="text" name="venue" class="ios-input" required placeholder="Hotel / Salón / Dirección">
        </div>
      </div>

      <!-- Inicio -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-play-circle"></i></div>
        <div class="ios-body">
          <div class="ios-label">Inicio<span class="text-danger">*</span></div>
          <input type="datetime-local" name="start_at" class="ios-input" required>
        </div>
      </div>

      <!-- Fin -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-stop-circle"></i></div>
        <div class="ios-body">
          <div class="ios-label">Fin <span class="text-danger">*</span></div>
          <input type="datetime-local" name="end_at" class="ios-input" required>
        </div>
      </div>

      <!-- Build start -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-hammer"></i></div>
        <div class="ios-body">
          <div class="ios-label">Inicio de montaje</div>
          <input type="datetime-local" name="build_start_at" class="ios-input">
        </div>
      </div>

      <!-- Strike end -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-wrench-adjustable"></i></div>
        <div class="ios-body">
          <div class="ios-label">Fin desmontaje</div>
          <input type="datetime-local" name="strike_end_at" class="ios-input">
        </div>
      </div>

      <!-- Creado por -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-person-check"></i></div>
        <div class="ios-body">
          <div class="ios-label">Creado por <span class="text-danger">*</span></div>
          <select name="created_by" class="ios-select js-ios-select" required>
            {% for o in owners %}<option value="{{ o.id }}">{{ o.full_name }}</option>{% endfor %}
          </select>
        </div>
        <div class="ios-caret"><i class="bi bi-chevron-down"></i></div>
      </div>

      <!-- Notas -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-sticky"></i></div>
        <div class="ios-body">
          <div class="ios-label">Notas</div>
          <textarea name="notes" class="ios-input" rows="3" placeholder="Notas para operación, accesos, etc."></textarea>
        </div>
      </div>
    </div>

    <div class="ios-actions">
      <a href="{{ url_for('events.events_list') }}" class="btn btn-secondary ios-btn">Cancelar</a>
      <button class="btn btn-success ios-btn">Crear evento</button>
    </div>
  </form>
</div>

<script>
  // TomSelect para: cliente, contacto y creado_por (misma estética/UX)
  document.addEventListener("DOMContentLoaded", () => {
    const clientEl  = document.getElementById("clientSel");
    const contactEl = document.getElementById("contactSel");

    // 1) Cliente (TomSelect)
    const tsClient = new TomSelect(clientEl, {
      create: false,
      allowEmptyOption: false,
      openOnFocus: true,
      placeholder: "Seleccionar…"
    });

    // 2) Contacto (TomSelect)
    const tsContact = new TomSelect(contactEl, {
      create: false,
      allowEmptyOption: true,
      openOnFocus: true,
      placeholder: "Seleccionar…"
    });

    // 3) Creado por (TomSelect) - como ya lo tenías
    document.querySelectorAll("select.js-ios-select").forEach((el) => {
      // Evita re-instanciar cliente/contacto (ya tienen ts arriba)
      if (el === clientEl || el === contactEl) return;
      if (el.tomselect) return;
      new TomSelect(el, {
        create: false,
        allowEmptyOption: true,
        openOnFocus: true,
        placeholder: "Seleccionar…"
      });
    });

    // 4) Filtrar contactos por cliente: reconstruir opciones del TomSelect de contacto
    const allContacts = [...contactEl.querySelectorAll("option")]
      .filter(o => o.value) // sin el "—"
      .map(o => ({
        value: o.value,
        text: o.textContent.trim(),
        clientId: String(o.dataset.client || "")
      }));

    function rebuildContactsForClient(cid){
      cid = String(cid || "");

      // Guarda el valor actual para ver si aún aplica
      const prev = tsContact.getValue();

      // Limpia opciones actuales
      tsContact.clear(true);
      tsContact.clearOptions();

      // Re-agrega opción vacía (—)
      tsContact.addOption({ value: "", text: "—" });

      // Agrega SOLO contactos del cliente seleccionado
      allContacts
        .filter(c => c.clientId === cid)
        .forEach(c => tsContact.addOption({ value: c.value, text: c.text }));

      tsContact.refreshOptions(false);

      // Si el contacto previo ya no existe en el nuevo set, queda vacío
      const stillExists = allContacts.some(c => c.clientId === cid && c.value === prev);
      if (stillExists) tsContact.setValue(prev, true);
      else tsContact.setValue("", true);
    }

    // Inicial + cambios
    rebuildContactsForClient(tsClient.getValue());

    tsClient.on("change", (val) => {
      rebuildContactsForClient(val);
    });
  });

  // Filtra contactos por cliente
  (function(){
    const clientSel  = document.getElementById('clientSel');
    const contactSel = document.getElementById('contactSel');

    function filterContacts(){
      const cid = clientSel.value;
      [...contactSel.options].forEach(opt => {
        if(!opt.value) { opt.hidden = false; return; }
        opt.hidden = (opt.dataset.client !== cid);
      });
      if (contactSel.selectedOptions.length && contactSel.selectedOptions[0].hidden) {
        contactSel.value = "";
      }
    }

    clientSel.addEventListener('change', filterContacts);
    filterContacts();
  })();

  // TomSelect SOLO donde sí conviene (created_by)
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("select.js-ios-select").forEach((el) => {
      if (el.tomselect) return;
      new TomSelect(el, {
        create: false,
        allowEmptyOption: true,
        openOnFocus: true,
        placeholder: "Seleccionar…"
      });
    });
  });
</script>

{% endblock %}
