{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
  {% set u = user %}

  <form method="POST" class="ios-form" id="userEditForm">
    <h1 class="ios-title">Editar Usuario</h1>

    <div class="ios-group">
      <!-- Nombre -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-person"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nombre completo</div>
          <input name="full_name" class="ios-input" placeholder="Ej. Juan Pérez" value="{{ u.full_name or '' }}">
        </div>
      </div>

      <!-- Email -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-envelope"></i></div>
        <div class="ios-body">
          <div class="ios-label">Correo</div>
          <input name="email" type="email" class="ios-input" placeholder="correo@dominio.com" value="{{ u.email or '' }}" required>
        </div>
      </div>

      <!-- Teléfono -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-telephone"></i></div>
        <div class="ios-body">
          <div class="ios-label">Teléfono</div>
          <input name="phone" class="ios-input" placeholder="+504 9999-9999" value="{{ u.phone or '' }}">
        </div>
      </div>

      <!-- Rol -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-person-badge"></i></div>
        <div class="ios-body">
          <div class="ios-label">Rol</div>
          <select name="role" class="ios-select js-ios-select" required>
            {% for r in roles %}
              <option value="{{ r }}" {{ 'selected' if u.role == r else '' }}>{{ USER_ROLE_ES.get(r, r|capitalize) }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="ios-caret"><i class="bi bi-chevron-down"></i></div>
      </div>

      <!-- Sueldo base -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-cash-coin"></i></div>
        <div class="ios-body">
          <div class="ios-label">Sueldo base (planilla)</div>
          <input name="base_salary" type="number" step="0.01" min="0" class="ios-input"
                 placeholder="0.00" value="{{ '%.2f'|format(u.base_salary or 0) }}">
        </div>
      </div>

      <!-- Nueva contraseña (opcional) -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-lock"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nueva contraseña (opcional)</div>
          <input id="new_password" name="new_password" type="password" class="ios-input" placeholder="Deja en blanco para no cambiar">
        </div>
      </div>

      <!-- Activo (switch) -->
      <div class="ios-row">
        <div class="ios-switch">
          <div class="ios-switch-label">
            <div class="ios-ico"><i class="bi bi-check2-circle"></i></div>
            <span>Activo</span>
          </div>

          <label class="ios-toggle-wrap">
            <input class="ios-toggle-input" type="checkbox" name="active" value="1" {{ 'checked' if u.active else '' }}>
            <span class="ios-toggle"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="ios-actions">
      <a href="{{ url_for('users.users_list') }}" class="btn btn-secondary ios-btn">Cancelar</a>
      <button class="btn btn-success ios-btn">Guardar</button>
    </div>
  </form>
</div>

{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!window.TomSelect) return;

  document.querySelectorAll("select.js-ios-select").forEach((el) => {
    if (el.tomselect) return;

    new TomSelect(el, {
      create: false,
      allowEmptyOption: true,
      openOnFocus: true,
      placeholder: "Seleccionar…"
    });
  });
});
</script>
