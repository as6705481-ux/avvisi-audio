{% extends "layout.html" %}
{% block content %}
<style>
/* modal “iOS” usable */
.ios-modal{ border-radius: 18px; overflow: hidden; }
.ios-modal-header{ border-bottom: 1px solid var(--ios-border); }
.ios-modal-body{
  max-height: 72vh;
  overflow: auto;
  padding: 14px;
}
.ios-modal-footer{
  border-top: 1px solid var(--ios-border);
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(8px);
}
.ios-section-title{
  font-weight: 800;
  color: var(--ios-text);
  margin: 12px 4px 8px 4px;
  font-size: 13px;
  letter-spacing: .2px;
}
.ios-help{
  margin-top: 6px;
  font-size: 12px;
  color: var(--ios-muted);
}
</style>
<div class="container mt-5">
  <form method="POST" class="ios-form" id="clientForm">
    <h1 class="ios-title">Agregar Cliente</h1>

    <div class="ios-group">
      <!-- Nombre -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-person-vcard"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nombre del cliente <span class="text-danger">*</span></div>
          <input name="name" class="ios-input" required placeholder="Nombre del cliente">
        </div>
      </div>

      <!-- RTN -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-receipt"></i></div>
        <div class="ios-body">
          <div class="ios-label">RTN <span class="text-danger">*</span></div>
          <input name="tax_id" class="ios-input" required placeholder="RTN">
        </div>
      </div>

      <!-- Email -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-envelope"></i></div>
        <div class="ios-body">
          <div class="ios-label">Correo electrónico</div>
          <input name="email" type="email" class="ios-input" placeholder="correo@dominio.com">
        </div>
      </div>

      <!-- Teléfono -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-telephone"></i></div>
        <div class="ios-body">
          <div class="ios-label">Teléfono <span class="text-danger">*</span></div>
          <input name="phone" class="ios-input" required placeholder="+504 9999-9999">
        </div>
      </div>

      <!-- Organización -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-diagram-3"></i></div>
        <div class="ios-body">
          <div class="ios-label">Organización</div>
          <input name="organization_id" class="ios-input" placeholder="UUID de organización (opcional)">
        </div>
      </div>
    </div>

    <!-- Dirección -->
    <div class="mt-3 mb-2" style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;color:var(--ios-text);">Dirección <span class="text-danger">*</span></div>
      <small style="color:var(--ios-muted);">Ubicación</small>
    </div>

    <div class="ios-group">
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-geo-alt"></i></div>
        <div class="ios-body">
          <div class="ios-label">Calle</div>
          <input name="street" class="ios-input" placeholder="Calle" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-pin-map"></i></div>
        <div class="ios-body">
          <div class="ios-label">Ciudad</div>
          <input name="city" class="ios-input" placeholder="Ciudad" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-map"></i></div>
        <div class="ios-body">
          <div class="ios-label">Estado / Depto</div>
          <input name="state" class="ios-input" placeholder="Estado/Depto" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-mailbox"></i></div>
        <div class="ios-body">
          <div class="ios-label">ZIP</div>
          <input name="zip" class="ios-input" placeholder="ZIP">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-globe"></i></div>
        <div class="ios-body">
          <div class="ios-label">País</div>
          <input name="country" class="ios-input" placeholder="País" required>
        </div>
      </div>

      <!-- Cliente eventual (switch) -->
      <div class="ios-row">
        <div class="ios-switch">
          <div class="ios-switch-label">
            <div class="ios-ico"><i class="bi bi-hourglass-split"></i></div>
            <span>Cliente eventual</span>
          </div>

          <label class="ios-toggle-wrap">
            <input class="ios-toggle-input" type="checkbox" name="is_eventual" id="is_eventual" value="1">
            <span class="ios-toggle"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="ios-actions">
      <a href="{{ url_for('clients.clients') }}" class="btn btn-secondary ios-btn">Cancelar</a>
      <button class="btn btn-success ios-btn">Crear</button>
    </div>
  </form>
</div>

{% endblock %}
