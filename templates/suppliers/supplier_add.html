{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
  <form method="POST" class="ios-form" id="supplierForm">
    <h1 class="ios-title">Agregar Proveedor</h1>

    <div class="ios-group">
      <!-- Nombre -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-building"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nombre <span class="text-danger">*</span></div>
          <input name="name" class="ios-input" required placeholder="Nombre del proveedor">
        </div>
      </div>

      <!-- Email -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-envelope"></i></div>
        <div class="ios-body">
          <div class="ios-label">Correo electrónico <span class="text-danger">*</span></div>
          <input name="email" type="email" class="ios-input" required placeholder="correo@dominio.com">
        </div>
      </div>

      <!-- Teléfono -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-telephone"></i></div>
        <div class="ios-body">
          <div class="ios-label">Teléfono <span class="text-danger">*</span></div>
          <input name="phone" class="ios-input" required placeholder="+504 9999-9999">
        </div>
      </div>

      <!-- RTN -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-receipt"></i></div>
        <div class="ios-body">
          <div class="ios-label">RTN <span class="text-danger">*</span></div>
          <input name="tax_id" class="ios-input" required placeholder="RTN del proveedor">
        </div>
      </div>

      <!-- Notas -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-chat-left-text"></i></div>
        <div class="ios-body">
          <div class="ios-label">Notas</div>
          <textarea name="notes" class="ios-input" rows="2" placeholder="Notas (opcional)"></textarea>
        </div>
      </div>
    </div>

    <!-- Dirección -->
    <div class="mt-3 mb-2" style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;color:var(--ios-text);">Dirección <span class="text-danger">*</span></div>
      <small style="color:var(--ios-muted);">Datos de ubicación</small>
    </div>

    <div class="ios-group">
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-geo-alt"></i></div>
        <div class="ios-body">
          <div class="ios-label">Calle</div>
          <input name="street" class="ios-input" placeholder="Calle" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-pin-map"></i></div>
        <div class="ios-body">
          <div class="ios-label">Ciudad</div>
          <input name="city" class="ios-input" placeholder="Ciudad" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-map"></i></div>
        <div class="ios-body">
          <div class="ios-label">Estado / Depto</div>
          <input name="state" class="ios-input" placeholder="Estado/Depto" required>
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-mailbox"></i></div>
        <div class="ios-body">
          <div class="ios-label">ZIP</div>
          <input name="zip" class="ios-input" placeholder="ZIP">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-globe"></i></div>
        <div class="ios-body">
          <div class="ios-label">País</div>
          <input name="country" class="ios-input" placeholder="País" required>
        </div>
      </div>

      <!-- Activo (switch) -->
      <div class="ios-row">
        <div class="ios-switch">
          <div class="ios-switch-label">
            <div class="ios-ico"><i class="bi bi-check2-circle"></i></div>
            <span>Activo</span>
          </div>

          <label class="ios-toggle-wrap">
            <input class="ios-toggle-input" type="checkbox" name="active" id="active" value="1" checked>
            <span class="ios-toggle"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="ios-actions">
      <a href="{{ url_for('suppliers.suppliers_list') }}" class="btn btn-secondary ios-btn">Cancelar</a>
      <button class="btn btn-success ios-btn">Crear</button>
    </div>
  </form>
</div>

{% endblock %}
