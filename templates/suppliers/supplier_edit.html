{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
  {% set s = supplier %}
  {% set a = s.address or {} %}

  <form method="POST" class="ios-form" id="supplierForm">
    <h1 class="ios-title">Editar Proveedor</h1>

    <div class="ios-group">
      <!-- Nombre -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-building"></i></div>
        <div class="ios-body">
          <div class="ios-label">Nombre del proveedor <span class="text-danger">*</span></div>
          <input name="name" class="ios-input" value="{{ s.name or '' }}" required>
        </div>
      </div>

      <!-- Email -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-envelope"></i></div>
        <div class="ios-body">
          <div class="ios-label">Correo electrónico</div>
          <input name="email" type="email" class="ios-input" value="{{ s.email or '' }}" placeholder="correo@dominio.com">
        </div>
      </div>

      <!-- Teléfono -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-telephone"></i></div>
        <div class="ios-body">
          <div class="ios-label">Teléfono <span class="text-danger">*</span></div>
          <input name="phone" class="ios-input" value="{{ s.phone or '' }}" required>
        </div>
      </div>

      <!-- RTN -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-card-text"></i></div>
        <div class="ios-body">
          <div class="ios-label">RTN</div>
          <input name="tax_id" class="ios-input" value="{{ s.tax_id or '' }}" placeholder="RTN del proveedor">
        </div>
      </div>

      <!-- Notas -->
      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-journal-text"></i></div>
        <div class="ios-body">
          <div class="ios-label">Notas</div>
          <textarea name="notes" class="ios-input" rows="2" style="resize: vertical;">{{ s.notes or '' }}</textarea>
        </div>
      </div>

      <!-- Activo (switch) -->
      <div class="ios-row">
        <div class="ios-switch">
          <div class="ios-switch-label">
            <div class="ios-ico"><i class="bi bi-check2-circle"></i></div>
            <span>Activo</span>
          </div>

          <label class="ios-toggle-wrap">
            <input class="ios-toggle-input" type="checkbox" name="active" id="active" value="1" {{ 'checked' if s.active else '' }}>
            <span class="ios-toggle"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Dirección (grupo aparte) -->
    <div class="ios-group mt-4">
      <div class="px-2 pb-2" style="color:#6c757d; font-weight:600;">
        Dirección <span class="text-danger">*</span>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-geo-alt"></i></div>
        <div class="ios-body">
          <div class="ios-label">Calle</div>
          <input name="street" class="ios-input" placeholder="Calle" value="{{ a.street or '' }}">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-building"></i></div>
        <div class="ios-body">
          <div class="ios-label">Ciudad</div>
          <input name="city" class="ios-input" placeholder="Ciudad" value="{{ a.city or '' }}">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-map"></i></div>
        <div class="ios-body">
          <div class="ios-label">Estado / Depto</div>
          <input name="state" class="ios-input" placeholder="Estado/Depto" value="{{ a.state or '' }}">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-mailbox"></i></div>
        <div class="ios-body">
          <div class="ios-label">ZIP</div>
          <input name="zip" class="ios-input" placeholder="ZIP" value="{{ a.zip or '' }}">
        </div>
      </div>

      <div class="ios-row">
        <div class="ios-ico"><i class="bi bi-globe"></i></div>
        <div class="ios-body">
          <div class="ios-label">País</div>
          <input name="country" class="ios-input" placeholder="País" value="{{ a.country or '' }}">
        </div>
      </div>
    </div>

    <div class="ios-actions mt-4">
      <a href="{{ url_for('suppliers.suppliers_list') }}" class="btn btn-secondary ios-btn">Cancelar</a>
      <button class="btn btn-success ios-btn">Guardar</button>
    </div>
  </form>
</div>

{% endblock %}
